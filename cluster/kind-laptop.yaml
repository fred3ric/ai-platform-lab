# Cluster kind du profil laptop : un seul nœud pour économiser la RAM.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      # Point d'entrée futur de la gateway (NodePort 30080 -> http://localhost:8080).
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
